[project]
name = "flask-app"
version = "0.1.0"
description = "Inventory Management System - Flask REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-caching>=2.1.0",
    "flask-login>=0.6.3",
    "flask-restx>=1.3.0",
    "marshmallow>=3.20.0",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.2",
    "pytest>=9.0.2",
    "pytest-flask>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
]
prod = [
    "pymysql>=1.1.0",
    "redis>=5.0.0",
]

[project.scripts]
flask-app = "run:main"
