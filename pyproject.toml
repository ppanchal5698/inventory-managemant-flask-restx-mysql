[project]
name = "flask-app"
version = "0.2.0"
description = "Inventory Management System - Async Flask REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask[async]>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "flask-migrate>=4.0.0",
    "flask-caching>=2.1.0",
    "flask-jwt-extended>=4.5.0",
    "flask-restx>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    "email-validator>=2.0.0",
    "cryptography>=41.0.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-redis",
    "types-pymysql",
]

[project.scripts]
flask-app = "run:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
